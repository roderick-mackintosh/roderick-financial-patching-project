- name: Gather installed hotfixes before patch
  ansible.windows.win_shell: |
    Get-HotFix | Select-Object HotFixID, InstalledOn | ConvertTo-Json
  register: hotfixes_before_raw
  changed_when: false

- name: Apply Windows updates
  ansible.windows.win_updates:
    category_names: "{{ windows_update_categories }}"
    reboot: false
  register: win_update_result

- name: Reboot if required
  ansible.windows.win_reboot:
    reboot_timeout: "{{ reboot_timeout }}"
  when: win_update_result.reboot_required | default(false)

- name: Wait for host connectivity after reboot
  ansible.builtin.wait_for_connection:
    timeout: 300

- name: Confirm connectivity
  ansible.windows.win_ping:

- name: Gather installed hotfixes after patch
  ansible.windows.win_shell: |
    Get-HotFix | Select-Object HotFixID, InstalledOn | ConvertTo-Json
  register: hotfixes_after_raw
  changed_when: false

- name: Record patch results
  ansible.builtin.set_fact:
    packages_before: "{{ (hotfixes_before_raw.stdout | default('[]') | trim | default('[]')) | from_json }}"
    packages_after: "{{ (hotfixes_after_raw.stdout | default('[]') | trim | default('[]')) | from_json }}"
    updates_applied: "{{ win_update_result.updates | default([]) }}"
    reboot_performed: "{{ win_update_result.reboot_required | default(false) }}"
