---
- name: Collect service facts (Linux)
  ansible.builtin.service_facts:
  when: ansible_os_family != "Windows"

- name: Verify services are running (Linux)
  ansible.builtin.assert:
    that:
      - service_facts.services[item].state == "running"
    fail_msg: "Service {{ item }} is not running."
  loop: "{{ service_checks }}"
  when: ansible_os_family != "Windows"

- name: Verify services are running (Windows)
  ansible.windows.win_service:
    name: "{{ item }}"
    state: started
  loop: "{{ service_checks }}"
  when: ansible_os_family == "Windows"

- name: Capture kernel version (Linux)
  ansible.builtin.command: uname -r
  register: kernel_version
  changed_when: false
  when: ansible_os_family != "Windows"

- name: Assert expected kernel version when provided (Linux)
  ansible.builtin.assert:
    that:
      - kernel_version.stdout is defined
      - expected_kernel_version | length == 0 or kernel_version.stdout == expected_kernel_version
    fail_msg: "Kernel version {{ kernel_version.stdout }} does not match expected {{ expected_kernel_version }}."
  when: ansible_os_family != "Windows"

- name: Capture OS version (Windows)
  ansible.windows.win_shell: "(Get-ComputerInfo).OsVersion"
  register: os_version_win
  changed_when: false
  when: ansible_os_family == "Windows"

- name: Assert expected OS version when provided (Windows)
  ansible.builtin.assert:
    that:
      - os_version_win.stdout is defined
      - expected_os_version | length == 0 or (os_version_win.stdout -match expected_os_version)
    fail_msg: "OS version {{ os_version_win.stdout }} does not match expected {{ expected_os_version }}."
  when: ansible_os_family == "Windows"

- name: Check recent logs for errors (Linux)
  ansible.builtin.shell: "tail -n 200 /var/log/syslog | grep -Ei 'error|fail'"
  register: log_errors
  changed_when: false
  failed_when: false
  when:
    - ansible_os_family != "Windows"
    - check_logs_enabled | bool

- name: Fail if high priority errors found (Linux)
  ansible.builtin.assert:
    that:
      - log_errors.stdout == ""
    fail_msg: "Errors found in recent logs:\n{{ log_errors.stdout }}"
  when:
    - ansible_os_family != "Windows"
    - check_logs_enabled | bool

- name: Mark health check status
  ansible.builtin.set_fact:
    health_check_status: "passed"
